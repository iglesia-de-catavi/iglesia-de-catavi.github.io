<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iglesia de Catavi | Recorrido 3D</title>

    <meta
        name="description"
        content="Explora la Iglesia de Catavi mediante un recorrido interactivo en 3D y conoce la imagen de la Virgen del Buen Consejo."
    >

    <meta name="theme-color" content="#080d18">

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Estilos de la página -->
    <link rel="stylesheet" href="css/modelo3d.css">
    <link rel="stylesheet" href="css/sol.css">
    <link rel="stylesheet" href="css/puntos.css">
    <link rel="stylesheet" href="css/extras.css">

    <!-- Importación de Three.js -->
    <script
        async
        src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"
    ></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.6.8/build/index.module.js"
        }
    }
    </script>
</head>

<body class="page-modelo3d">

    <!-- VISOR 3D DE LA IGLESIA Y LA VIRGEN -->
    <main id="viewer" aria-label="Recorrido 3D de la Iglesia de Catavi">
    </main>

    <!-- MENSAJES DE CARGA -->
    <div id="loader" class="loader" role="status" aria-live="polite">
        Cargando modelo 3D...
    </div>

    <!-- CONTROLES DEL RECORRIDO -->
    <nav class="controls-3d" aria-label="Controles del recorrido 3D">

        <button
            type="button"
            id="btnInicio"
            title="Volver a la página principal"
        >
            <span>← Inicio</span>
        </button>

        <button
            type="button"
            id="btnReset"
            title="Regresar a la vista exterior de la iglesia"
        >
            <span>Restablecer vista</span>
        </button>

        <button
            type="button"
            id="btnAuto"
            title="Activar o detener el giro automático"
        >
            <span>Giro automático</span>
        </button>

        <!-- CONTROL DEL SOL: Día / Atardecer / Noche -->
        <div id="btnLight" class="sun-control" title="Cambiar el momento del día">
            <div id="sunLabel" class="sun-label">☀️ Día</div>
            <div class="sun-rail">
                <div
                    id="sunTrack"
                    class="sun-track"
                    role="slider"
                    tabindex="0"
                    aria-label="Momento del día"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                >
                    <div id="sunThumb" class="sun-thumb">☀️</div>
                </div>
                <div class="sun-stops">
                    <button type="button" data-sun="0" title="Día">☀️</button>
                    <button type="button" data-sun="0.5" title="Atardecer">🌇</button>
                    <button type="button" data-sun="1" title="Noche">🌙</button>
                </div>
            </div>
        </div>

        <button
            type="button"
            id="btnVirgen"
            title="Ver la imagen completa de la Virgen del Buen Consejo"
        >
            <span>Ver Virgen del Buen Consejo</span>
        </button>

        <button
            type="button"
            id="btnWalk"
            title="Explorar mediante el modo caminar"
        >
            <span>Caminar</span>
        </button>

        <button
            type="button"
            id="btnTour"
            title="Iniciar el recorrido guiado"
        >
            <span>Recorrido guiado</span>
        </button>

        <button
            type="button"
            id="btnPhoto"
            title="Guardar una captura del modelo 3D"
        >
            <span>Guardar fotografía</span>
        </button>

        <button
            type="button"
            id="btnFull"
            title="Activar o salir de pantalla completa"
        >
            <span>Pantalla completa</span>
        </button>

        <button
            type="button"
            id="btnMenu"
            title="Mostrar u ocultar los controles"
        >
            <span>Ocultar controles</span>
        </button>

    </nav>

    <!-- AYUDA PARA EXPLORAR LA ESCENA -->
    <div id="hint" class="hint">
        Arrastra para girar · Usa la rueda para acercarte o alejarte
        · Pulsa el punto dorado de la puerta para entrar
    </div>

    <!-- AYUDA DEL MODO CAMINAR -->
    <div id="walkHelp" class="walk-help" aria-live="polite">
        Modo caminar: utiliza W, A, S y D para moverte.
        Mueve el ratón para mirar y pulsa ESC para salir.
    </div>

    <!-- PANEL DE INFORMACIÓN DE LOS PUNTOS -->
    <section
        id="infoCard"
        class="punto-panel"
        role="status"
        aria-live="polite"
        aria-atomic="true"
    >
        <button
            type="button"
            id="closeInfo"
            class="punto-cerrar"
            aria-label="Cerrar información"
            title="Cerrar información"
        >
            ×
        </button>

        <span id="infoKicker" class="punto-kicker" hidden></span>

        <h2 id="infoTitle"></h2>

        <div id="infoSobreWrap" class="punto-seccion">
            <h3>Sobre este lugar</h3>
            <p id="infoText"></p>
        </div>

        <div id="infoCuriosoWrap" class="punto-seccion punto-curioso" hidden>
            <h3>Dato curioso</h3>
            <p id="infoCurioso"></p>
        </div>

        <p id="infoFuente" class="punto-fuente" hidden></p>

        <div id="infoNav" class="punto-nav" hidden>
            <button type="button" id="infoPrev">‹ Anterior</button>
            <button type="button" id="infoNext">Siguiente ›</button>
        </div>
    </section>


    <!-- JAVASCRIPT DEL RECORRIDO 3D -->
    <script type="module" src="js/iglesia.js"></script>

    <!-- MÚSICA (mus_3d en esta página) -->
    <script src="js/musica.js"></script>

</body>
</html>
